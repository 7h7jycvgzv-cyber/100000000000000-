<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100兆円への記録</title>
<meta name="description" content="22歳、スキルなし・資金なしから100兆円を目指す記録。AI→宇宙→量子。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #ECEFF4;
    --surface: #FFFFFF;
    --ink: #142030;
    --muted: #5A6879;
    --line: #D3D9E2;
    --accent: #2B54D9;
    --done: #178F62;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0C121B; --surface: #141C28; --ink: #E5EAF1; --muted: #8C98AA;
      --line: #253142; --accent: #7E9CFF; --done: #3CC48E;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.7;
    padding: 48px 16px 64px;
  }
  main { max-width: 680px; margin: 0 auto; display: grid; gap: 40px; }
  .label { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; color: var(--muted); }
  h1 { font-size: clamp(32px, 7vw, 52px); font-weight: 900; line-height: 1.2; margin: 8px 0 16px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0; }
  .target {
    font-family: var(--mono); font-weight: 600; font-size: clamp(20px, 5vw, 30px);
    color: var(--accent); overflow-wrap: anywhere; margin: 0;
  }
  .path { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 700; }
  .path span { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .path i { color: var(--muted); font-style: normal; }
  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .log li {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; display: grid; gap: 4px;
  }
  .log .day { font-family: var(--mono); font-weight: 600; color: var(--done); }
  .log .todo .day { color: var(--muted); }
  .rules { margin: 0; padding-left: 1.2em; }
  footer { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="label">MISSION LOG · PHASE 1</div>
    <h1>100兆円への記録</h1>
    <p class="lead">22歳。スキルなし、資金なし。<br>AIで「作れる人」になるところから始めます。</p>
  </header>

  <section>
    <h2>目標</h2>
    <p class="target">¥100,000,000,000,000</p>
  </section>

  <section>
    <h2>道すじ</h2>
    <div class="path"><span>AI</span><i>→</i><span>宇宙</span><i>→</i><span>量子</span></div>
  </section>

  <section>
    <h2>毎日のルール</h2>
    <ul class="rules">
      <li>作る 3時間</li>
      <li>英語 30分</li>
      <li>発信 1回</li>
    </ul>
  </section>

  <section>
    <h2>記録</h2>
    <ol class="log">
      <li>
        <span class="day">Day 1 · 2026.10.31</span>
        <span>Claude Codeでこのページを作って、GitHub Pagesで公開した。</span>
      </li>
      <li class="todo">
        <span class="day">Day 2</span>
        <span>ターミナルとgitの基本(commit・push)を覚える。</span>
      </li>
    </ol>
  </section>

  <footer>毎日1つ、作ったものを公開していきます。</footer>
</main>
</body>
</html>
